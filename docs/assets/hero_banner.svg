  <text x="104" y="41" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="bold">civil-qto-mcp v0.5.0</text>
  <text x="275" y="41" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">— Deterministic CAD Geometry (DXF/DWG/PDF), 3D TIN Earthworks &amp; BoQ Auditing Engine</text>
