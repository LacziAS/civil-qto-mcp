    <linearGradient id="pavingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="islandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.38"/>
