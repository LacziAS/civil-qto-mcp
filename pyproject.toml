[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "civil-qto-mcp"
version = "0.6.2"
description = "Deterministic Model Context Protocol (MCP) server for Civil Engineering, Roadworks, Paving & Utilities Quantity Take-Off (DXF) and Bill of Quantities (XLSX/XLSM) Auditing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "András Sándor Laczi" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "civil-engineering",
    "quantity-takeoff",
    "qto",
    "boq",
    "dxf",
    "autocad",
    "bim",
    "construction",
    "roadworks",
    "utilities"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0",
    "ezdxf>=1.3.0",
    "shapely>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/LacziAS/civil-qto-mcp"
Repository = "https://github.com/LacziAS/civil-qto-mcp"
Issues = "https://github.com/LacziAS/civil-qto-mcp/issues"

[project.scripts]
civil-qto-mcp = "civil_qto_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civil_qto_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
